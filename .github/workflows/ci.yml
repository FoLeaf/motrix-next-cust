name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Repo integrity (locale parity + i18n usage)
        run: node scripts/check-repo-integrity.mjs

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: npx vite build

  backend:
    name: Backend Quality
    # Custom build targets Windows x86_64 only; run Rust quality gates on
    # the same platform so path-handling and cfg(windows) code are covered.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all-targets
