name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Custom build targets Windows x86_64 only.
  build:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Pin the MSVC target explicitly so the static WebView2Loader link
      # mode (target_env = "msvc") is guaranteed regardless of host default.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2

      - run: pnpm install

      # Drop any stale linked app binaries from the cache so the installer
      # always packages an exe built from the checked-out sources.
      - name: Clean stale app artifacts
        shell: bash
        run: |
          cd src-tauri
          cargo clean --release --package motrix-next-opt || true
          rm -rf target/release/motrix-next-opt.exe target/release/motrix_next_lib.dll
          rm -rf target/x86_64-pc-windows-msvc/release/motrix-next-opt.exe \
                 target/x86_64-pc-windows-msvc/release/motrix_next_lib.dll

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name || '' }}
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload build artifacts (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: motrix-next-windows-x86_64
          path: "${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}"
          retention-days: 7

  merge-updater-json:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v6

      - name: Generate and upload channel-specific updater JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/refresh-updater-json.sh "${{ github.event.release.tag_name }}"
